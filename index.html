<!doctype html>
<html lang="ar">
<head>
<title>Roblox GUI Converter</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a phone tool: toolbar, upload, notes, device preview, code. Dark first. */
:root{
  --bg:#0e0f11; --surface:#16181b; --surface2:#1d2024; --line:#2a2d33; --fg:#eceef1; --muted:#8c9098;
  --primary:#eceef1; --primary-fg:#111214; --accent:#4cc9a0; --danger:#ff7a7a; --stage:#050506;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f3; --line:#d9dce2; --fg:#16181c; --muted:#656a73;
    --primary:#16181c; --primary-fg:#f5f6f8; --accent:#0f8f6b; --danger:#c43d3d; --stage:#dfe2e8; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f3; --line:#d9dce2; --fg:#16181c; --muted:#656a73;
  --primary:#16181c; --primary-fg:#f5f6f8; --accent:#0f8f6b; --danger:#c43d3d; --stage:#dfe2e8; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px;text-align:left;direction:ltr}
.bar{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:42px}
button:hover:not(:disabled){background:var(--surface2)}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,.drop:focus-within,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:700}
button.primary:hover:not(:disabled){background:var(--primary);filter:brightness(.92)}
button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button svg{width:17px;height:17px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>h2{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:26px 12px;border:2px dashed var(--line);
  border-radius:12px;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--fg)}
.drop svg{width:30px;height:30px}
.drop b{font-weight:500;color:var(--fg)}
.drop small{direction:ltr;unicode-bidi:plaintext}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.thumb{position:relative;flex:none;width:84px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2);cursor:pointer;padding:0;display:block;min-height:0}
.thumb[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thumb img{display:block;width:100%;height:84px;object-fit:cover}
.thumb span{display:block;font-size:11px;padding:2px 6px;color:var(--muted);text-align:center}
.thumb .x{position:absolute;top:4px;inset-inline-start:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0;min-height:0;padding:0;justify-content:center;font-size:14px;line-height:1}
input{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
textarea{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:88px;resize:vertical}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.zoom{display:flex;align-items:center;gap:8px;margin-inline-start:auto;direction:ltr}
.zoom button{width:42px;justify-content:center;padding:0}
.zoom span{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.stage{background:var(--stage);border-radius:12px;padding:12px;overflow:auto;max-height:78vh;min-height:300px}
.empty{color:var(--muted);padding:28px 16px;border:1px solid var(--line);background:var(--surface);min-height:260px}
.dev{position:relative;margin:0 auto;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.devin{position:absolute;inset:0 auto auto 0;transform-origin:0 0;direction:ltr}
.rnode{position:absolute;overflow:hidden;display:flex;align-items:center}
.rnode>span{display:block;width:100%;white-space:pre-wrap;line-height:1.15}
.rnode.icon{background-size:100% 100%}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.status{min-height:24px;font-size:14px;color:var(--muted)}
.status.err{color:var(--danger)}
.status.ok{color:var(--accent)}
pre{margin:0;direction:ltr;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;
  font:12.5px/1.55 var(--mono);overflow:auto;max-height:60vh;tab-size:2;white-space:pre}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>


<div class="wrap" dir="rtl" lang="ar">
  <h1>Roblox GUI Converter</h1>

  <div class="bar" role="toolbar" aria-label="الأوضاع والتصدير">
    <button id="bBg" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></svg>نمط الصورة الكاملة (يتضمن الخلفية)</button>
    <button id="bClaude" class="primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>تحليل مطابق بـ Claude</button>
    <button id="bQuick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></svg>تحليل سريع</button>
    <button id="bPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>معاينة</button>
    <button id="bRbxm" class="primary" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>تصدير RBXM</button>
    <button id="bLua" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>تصدير Lua</button>
    <button id="bZip" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>تصدير الأيقونات ZIP</button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="row" id="codeRow" hidden><label for="acode">رمز الدخول</label><input id="acode" type="password" autocomplete="off"><button id="acodeOk">حفظ</button></div>

  <section class="card" aria-labelledby="upT">
    <h2 id="upT">رفع الصور</h2>
    <label class="drop" id="drop" for="file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
      <b>اسحب الصور هنا أو اضغط للاختيار</b>
      <small>PNG / JPG / JPEG / WEBP - بدون حد للعدد</small>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple>
    </label>
    <h2 id="cnt">الصور المرفوعة (0)</h2>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section class="card">
    <h2><label for="notes">ملاحظات للذكاء الاصطناعي</label></h2>
    <textarea id="notes" placeholder="اكتب هنا اللي تبيه من الذكاء: مثلاً زر «ابدأ» يفتح شاشة الإعدادات، الأزرار تتحرك عند الضغط، خلّ الخط عريض، اسم القائمة MainMenu..."></textarea>
    <div class="meta">الملاحظات تنرسل مع الصورة عند التحليل، ويقدر الذكاء يكتب منها كود Lua للأزرار.</div>
  </section>

  <section class="card">
    <div class="row">
      <div class="seg" role="group" aria-label="حجم الجهاز">
        <button data-dev="phone" aria-pressed="false">جوال</button>
        <button data-dev="tablet" aria-pressed="false">تابلت</button>
        <button data-dev="desktop" aria-pressed="true">كمبيوتر</button>
        <button data-dev="sony" aria-pressed="false">سوني</button>
      </div>
      <div class="zoom">
        <button id="zIn" aria-label="تكبير">+</button>
        <span id="zVal">100%</span>
        <button id="zOut" aria-label="تصغير">−</button>
      </div>
    </div>
    <div class="meta" id="devMeta"></div>
    <div class="chips" id="screenChips"></div>
    <div class="stage" id="stage"></div>
    <div id="codeBox" hidden>
      <div class="row" style="margin-bottom:8px"><button id="bCopy">نسخ الكود</button><span class="meta">LocalScript جاهز: حطه في StarterPlayerScripts</span></div>
      <pre id="code"></pre>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var DEV={phone:{w:390,h:844,n:'جوال',d:'390×844 (iPhone)'},tablet:{w:820,h:1180,n:'تابلت',d:'820×1180 (iPad)'},
  desktop:{w:1440,h:900,n:'كمبيوتر',d:'1440×900'},sony:{w:1920,h:1080,n:'سوني',d:'1920×1080 (PlayStation / تلفزيون)'}};
var S={screens:[],cur:0,device:'desktop',zoom:1,bg:false,view:'preview',busy:false,ctl:null};
var sample=null,downloads=null,canImages=false;

/* ---------------- helpers ---------------- */
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function status(msg,kind,spin){var s=$('#status');s.className='status'+(kind?' '+kind:'');s.replaceChildren();if(spin)s.appendChild(el('span','spin'));s.appendChild(document.createTextNode(msg||''))}
function clamp(n,a,b){n=Number(n);if(!isFinite(n))n=a;return Math.min(b,Math.max(a,n))}
function hex(c){if(typeof c!=='string')return null;c=c.trim();var m=/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c);if(!m)return null;c=m[1];if(c.length===3)c=c.split('').map(function(x){return x+x}).join('');return '#'+c.toLowerCase()}
function rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function ident(s,fb){s=String(s==null?'':s).replace(/[^A-Za-z0-9_]/g,'_').replace(/^_+|_+$/g,'');if(!s)s=fb;if(/^[0-9]/.test(s))s='_'+s;return s.slice(0,40)}
function fix(n){return +(+n).toFixed(4)}

/* ---------------- model normalisation ---------------- */
var CLASSES={Frame:1,TextLabel:1,TextButton:1,ImageLabel:1,TextBox:1,ScrollingFrame:1};
function normalise(raw,sc){
  var out={name:ident(raw&&raw.name,'Screen'+(S.screens.indexOf(sc)+1)),bg:hex(raw&&raw.backgroundColor)||'#111111',logic:typeof(raw&&raw.logic)==='string'?raw.logic:'',els:[]};
  var seen={},list=Array.isArray(raw&&raw.elements)?raw.elements.slice(0,120):[];
  list.forEach(function(r,i){
    if(!r||typeof r!=='object')return;
    var cls=CLASSES[r.class]?r.class:'Frame';
    var text=typeof r.text==='string'?r.text:'';
    if(text&&cls==='Frame')cls='TextLabel';
    var nm=ident(r.name,cls+(i+1));var base=nm,k=2;while(seen[nm]){nm=base+'_'+k++}seen[nm]=1;
    var x=clamp(r.x,0,1),y=clamp(r.y,0,1),w=clamp(r.w,0.002,1),h=clamp(r.h,0.002,1);
    if(x+w>1)w=1-x;if(y+h>1)h=1-y;
    var st=r.stroke&&typeof r.stroke==='object'?{c:hex(r.stroke.color),t:clamp(r.stroke.thickness,0,12)}:null;
    if(st&&(!st.c||st.t<=0))st=null;
    out.els.push({name:nm,cls:cls,parent:typeof r.parent==='string'?ident(r.parent,''):'',x:x,y:y,w:w,h:h,
      bg:hex(r.bg),alpha:clamp(r.bgAlpha==null?1:r.bgAlpha,0,1),radius:clamp(r.radius,0,0.5),stroke:st,
      text:text,color:hex(r.textColor)||'#ffffff',size:clamp(r.textSize==null?0.03:r.textSize,0.008,0.3),
      bold:!!r.bold,align:/^(left|right|center)$/.test(r.align)?r.align:'center',icon:!!r.icon||cls==='ImageLabel',z:Math.round(clamp(r.z,0,50)),order:i,children:[]});
  });
  return out;
}
function tree(model){
  var map={};model.els.forEach(function(e){map[e.name]=e;e.children=[]});
  var roots=[];
  model.els.forEach(function(e){
    var p=map[e.parent];
    if(p&&p!==e&&!isAncestor(e,p,map)&&p.w>0.01&&p.h>0.01){p.children.push(e);e.pnode=p}else{e.pnode=null;roots.push(e)}
  });
  function rel(e){
    var p=e.pnode;
    e.rx=p?(e.x-p.x)/p.w:e.x;e.ry=p?(e.y-p.y)/p.h:e.y;e.rw=p?e.w/p.w:e.w;e.rh=p?e.h/p.h:e.h;
    e.children.sort(function(a,b){return a.z-b.z||a.order-b.order});e.children.forEach(rel);
  }
  roots.sort(function(a,b){return a.z-b.z||a.order-b.order});roots.forEach(rel);
  return roots;
}
function isAncestor(e,p,map){var n=0;while(p&&n++<50){if(p===e)return true;p=map[p.parent]}return false}

/* ---------------- generators (Lua / RBXM) ---------------- */
//#GEN-START
var FONTS={SourceSans:3,SourceSansBold:4,Gotham:16,GothamBold:18};
var XAL={Left:0,Right:1,Center:2};
function en(e,m,n){return {e:e,m:m,n:n}}
function props(node,isRoot,sc,first){
  var p=[];
  p.push(['Name','string',node.name]);
  if(isRoot){
    p.push(['AnchorPoint','V2',[0.5,0.5]]);
    p.push(['Position','UDim2',[0.5,0,0.5,0]]);
    p.push(['Size','UDim2',[1,0,1,0]]);
    p.push(['BackgroundColor3','C3',rgb(sc.bg)]);
    p.push(['BorderSizePixel','int',0]);
    p.push(['ClipsDescendants','bool',true]);
    p.push(['Visible','bool',!!first]);
    return p;
  }
  var cls=node.cls;
  p.push(['Position','UDim2',[fix(node.rx),0,fix(node.ry),0]]);
  p.push(['Size','UDim2',[fix(node.rw),0,fix(node.rh),0]]);
  var bg=node.bg;
  p.push(['BackgroundColor3','C3',rgb(bg||'#000000')]);
  p.push(['BackgroundTransparency','float',bg?fix(1-node.alpha):1]);
  p.push(['BorderSizePixel','int',0]);
  p.push(['ZIndex','int',node.z+1]);
  if(cls==='TextLabel'||cls==='TextButton'||cls==='TextBox'){
    var fn=node.bold?'GothamBold':'Gotham';
    if(cls==='TextBox'){p.push(['PlaceholderText','string',node.text]);p.push(['Text','string','']);p.push(['ClearTextOnFocus','bool',false])}
    else p.push(['Text','string',node.text]);
    p.push(['TextColor3','C3',rgb(node.color)]);
    p.push(['TextScaled','bool',true]);
    p.push(['TextWrapped','bool',true]);
    p.push(['Font','enum',en('Font',fn,FONTS[fn])]);
    var al=node.align.charAt(0).toUpperCase()+node.align.slice(1);
    p.push(['TextXAlignment','enum',en('TextXAlignment',al,XAL[al])]);
    p.push(['TextYAlignment','enum',en('TextYAlignment','Center',1)]);
    if(cls==='TextButton')p.push(['AutoButtonColor','bool',false]);
  }
  if(cls==='ImageLabel')p.push(['Image','string','']);
  if(cls==='ScrollingFrame'){p.push(['ScrollBarThickness','int',4]);p.push(['CanvasSize','UDim2',[0,0,0,0]]);p.push(['AutomaticCanvasSize','enum',en('AutomaticSize','Y',2)])}
  return p;
}
function uiKids(node,isRoot,sc){
  var k=[];
  if(isRoot){k.push({cls:'UIAspectRatioConstraint',p:[['AspectRatio','float',fix(sc.aspect)]]});return k}
  if(node.radius>0)k.push({cls:'UICorner',p:[['CornerRadius','UDim',[fix(node.radius),0]]]});
  if(node.stroke)k.push({cls:'UIStroke',p:[['Color','C3',rgb(node.stroke.c)],['Thickness','float',node.stroke.t]]});
  if(node.text&&(node.cls==='TextLabel'||node.cls==='TextButton'||node.cls==='TextBox'))
    k.push({cls:'UITextSizeConstraint',p:[['MaxTextSize','int',Math.max(8,Math.round(node.size*1080))],['MinTextSize','int',1]]});
  return k;
}
function luaStr(s){return '"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r/g,'').replace(/\n/g,'\\n')+'"'}
function luaVal(t,v){
  switch(t){
    case 'string':return luaStr(v);
    case 'bool':return v?'true':'false';
    case 'int':case 'float':return String(v);
    case 'UDim2':return 'UDim2.new('+v.join(', ')+')';
    case 'UDim':return 'UDim.new('+v.join(', ')+')';
    case 'V2':return 'Vector2.new('+v.join(', ')+')';
    case 'C3':return 'Color3.fromRGB('+v.join(', ')+')';
    case 'enum':return 'Enum.'+v.e+'.'+v.m;
  }
  return 'nil';
}
function luaProps(p){return '{'+p.map(function(x){return x[0]+' = '+luaVal(x[1],x[2])}).join(', ')+'}'}
var HELPERS=[
  'local function El(name)','\treturn gui:FindFirstChild(name, true)','end','',
  'local function showScreen(name)','\tfor _, c in ipairs(gui:GetChildren()) do','\t\tif c:IsA("Frame") then c.Visible = (c.Name == name) end','\tend','end'
].join('\n');
function genLua(project){
  var L=[];
  L.push('-- Roblox GUI Converter');
  L.push('-- ضع هذا السكربت كـ LocalScript داخل StarterPlayer > StarterPlayerScripts');
  L.push('local Players = game:GetService("Players")');
  L.push('local playerGui = Players.LocalPlayer:WaitForChild("PlayerGui")');
  L.push('');
  L.push('local function make(class, props, parent)');
  L.push('\tlocal o = Instance.new(class)');
  L.push('\tfor k, v in pairs(props) do o[k] = v end');
  L.push('\to.Parent = parent');
  L.push('\treturn o');
  L.push('end');
  L.push('');
  L.push('local gui = make("ScreenGui", {Name = "GeneratedGUI", ResetOnSpawn = false, IgnoreGuiInset = true, ZIndexBehavior = Enum.ZIndexBehavior.Sibling}, nil)');
  L.push('');
  project.screens.forEach(function(sc,si){
    L.push('do -- '+sc.name);
    L.push('\tlocal root = make("Frame", '+luaProps(props({name:sc.name},true,sc,si===0))+', gui)');
    uiKids(null,true,sc).forEach(function(k){L.push('\tmake("'+k.cls+'", '+luaProps(k.p)+', root)')});
    var n=0;
    (function emit(nodes,parentVar){
      nodes.forEach(function(nd){
        var v='e'+(++n);
        L.push('\tlocal '+v+' = make("'+nd.cls+'", '+luaProps(props(nd,false))+', '+parentVar+')');
        uiKids(nd,false).forEach(function(k){L.push('\tmake("'+k.cls+'", '+luaProps(k.p)+', '+v+')')});
        emit(nd.children,v);
      });
    })(sc.roots,'root');
    L.push('end');
    L.push('');
  });
  L.push(HELPERS);
  L.push('');
  if(project.logic.trim()){L.push('-- ===== منطق الأزرار (من الذكاء الاصطناعي) =====');L.push(project.logic.trim());L.push('')}
  L.push('gui.Parent = playerGui');
  return L.join('\n');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}
function xmlProp(x){
  var k=x[0],t=x[1],v=x[2],n=esc(k);
  switch(t){
    case 'string':return '<string name="'+n+'">'+esc(v)+'</string>';
    case 'bool':return '<bool name="'+n+'">'+(v?'true':'false')+'</bool>';
    case 'int':return '<int name="'+n+'">'+v+'</int>';
    case 'float':return '<float name="'+n+'">'+v+'</float>';
    case 'UDim2':return '<UDim2 name="'+n+'"><XS>'+v[0]+'</XS><XO>'+v[1]+'</XO><YS>'+v[2]+'</YS><YO>'+v[3]+'</YO></UDim2>';
    case 'UDim':return '<UDim name="'+n+'"><S>'+v[0]+'</S><O>'+v[1]+'</O></UDim>';
    case 'V2':return '<Vector2 name="'+n+'"><X>'+v[0]+'</X><Y>'+v[1]+'</Y></Vector2>';
    case 'C3':return '<Color3 name="'+n+'"><R>'+fix(v[0]/255)+'</R><G>'+fix(v[1]/255)+'</G><B>'+fix(v[2]/255)+'</B></Color3>';
    case 'enum':return '<token name="'+n+'">'+v.n+'</token>';
  }
  return '';
}
function genXml(project){
  var id=0,o=[];
  function item(cls,p,inner){
    o.push('<Item class="'+cls+'" referent="RBX'+(++id)+'"><Properties>'+p.map(xmlProp).join('')+'</Properties>');
    if(inner)inner();
    o.push('</Item>');
  }
  o.push('<?xml version="1.0" encoding="utf-8"?>');
  o.push('<roblox xmlns:xmime="http://www.w3.org/2005/05/xmlmime" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.roblox.com/roblox.xsd" version="4">');
  o.push('<External>null</External><External>nil</External>');
  item('ScreenGui',[['Name','string','GeneratedGUI'],['ResetOnSpawn','bool',false],['IgnoreGuiInset','bool',true],['ZIndexBehavior','enum',en('ZIndexBehavior','Sibling',1)]],function(){
    project.screens.forEach(function(sc,si){
      item('Frame',props({name:sc.name},true,sc,si===0),function(){
        uiKids(null,true,sc).forEach(function(k){item(k.cls,k.p)});
        (function emit(nodes){
          nodes.forEach(function(nd){
            item(nd.cls,props(nd,false),function(){
              uiKids(nd,false).forEach(function(k){item(k.cls,k.p)});
              emit(nd.children);
            });
          });
        })(sc.roots);
      });
    });
    var src='local gui = script.Parent\n\n'+HELPERS.replace(/^local function El[\s\S]*?end\n\n/,'local function El(name)\n\treturn gui:FindFirstChild(name, true)\nend\n\n')+'\n';
    if(project.logic.trim())src+='\n-- ===== منطق الأزرار (من الذكاء الاصطناعي) =====\n'+project.logic.trim()+'\n';
    src=src.replace(/\]\]>/g,']] >');
    o.push('<Item class="LocalScript" referent="RBX'+(++id)+'"><Properties><string name="Name">GuiLogic</string><ProtectedString name="Source"><![CDATA['+src+']]></ProtectedString></Properties></Item>');
  });
  o.push('</roblox>');
  return o.join('\n');
}
//#GEN-END
function project(){
  var done=S.screens.filter(function(s){return s.model});
  return {screens:done.map(function(s){return {name:s.model.name,bg:s.model.bg,aspect:s.w/s.h,roots:s.roots}}),
    logic:done.map(function(s){return s.model.logic||''}).filter(Boolean).join('\n\n')};
}

/* ---------------- files ---------------- */
function addFiles(list){
  Array.prototype.forEach.call(list,function(f){
    if(!/^image\/(png|jpeg|webp)$/.test(f.type))return;
    var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){
      S.screens.push({id:Date.now()+Math.random(),file:f,url:url,img:img,w:img.naturalWidth,h:img.naturalHeight,model:null,roots:null});
      if(S.screens.length===1)S.cur=0;
      refresh();
    };
    img.onerror=function(){status('تعذّر قراءة الصورة: '+f.name,'err')};
    img.src=url;
  });
}
function refresh(){
  $('#cnt').textContent='الصور المرفوعة ('+S.screens.length+')';
  var t=$('#thumbs');t.replaceChildren();
  S.screens.forEach(function(sc,i){
    var b=el('div','thumb');b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-current',String(i===S.cur));
    var im=el('img');im.src=sc.url;im.alt='صورة '+(i+1);b.appendChild(im);
    b.appendChild(el('span','',sc.model?'تم التحليل':'بانتظار التحليل'));
    var x=el('button','x','×');x.setAttribute('aria-label','حذف');
    x.onclick=function(e){e.stopPropagation();URL.revokeObjectURL(sc.url);S.screens.splice(i,1);if(S.cur>=S.screens.length)S.cur=Math.max(0,S.screens.length-1);refresh()};
    b.appendChild(x);
    var sel=function(){S.cur=i;refresh()};
    b.onclick=sel;b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();sel()}};
    t.appendChild(b);
  });
  var any=S.screens.some(function(s){return s.model});
  ['#bRbxm','#bLua','#bZip'].forEach(function(s){$(s).disabled=!any||S.busy});
  $('#bClaude').disabled=$('#bQuick').disabled=!S.screens.length||(S.busy&&false);
  $('#bBg').setAttribute('aria-pressed',String(S.bg));
  render();
}

/* ---------------- AI analysis ---------------- */
function toBlob(img){
  return new Promise(function(res,rej){
    var m=1600,sc=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));
    var c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(b){b?res(b):rej({code:'image_rejected'})},'image/jpeg',0.92);
  });
}
function buildPrompt(sc,notes,quick){
  return [
'You convert a screenshot of a user interface into a Roblox GUI description. Look at the attached image carefully and reply with ONE JSON object only, no commentary.',
'',
'Image size: '+sc.w+'x'+sc.h+' px (aspect ratio '+(sc.w/sc.h).toFixed(4)+').',
'',
'JSON shape:',
'{',
'  "name": "PascalCaseScreenName",',
'  "backgroundColor": "#rrggbb",          // main background of the whole screen',
'  "elements": [',
'    {"name":"UniqueName","class":"Frame|TextLabel|TextButton|ImageLabel|TextBox|ScrollingFrame",',
'     "parent":"NameOfContainerElementOrEmpty",',
'     "x":0.1,"y":0.2,"w":0.5,"h":0.08,    // top-left corner and size as fractions (0..1) of the WHOLE image, never relative to the parent',
'     "bg":"#rrggbb or null","bgAlpha":1,   // null when transparent',
'     "radius":0.2,                         // corner radius as a fraction of the shorter side of the element (0..0.5)',
'     "stroke":{"color":"#rrggbb","thickness":1} or null,',
'     "text":"exact text as shown, same language and characters","textColor":"#rrggbb",',
'     "textSize":0.025,                     // text height as a fraction of image height',
'     "bold":true,"align":"left|center|right",',
'     "icon":false,                         // true for icons, logos, avatars and pictures that must be exported as images',
'     "z":0}                                // stacking order, higher is on top',
'  ],',
'  "logic": "Luau code or empty string"',
'}',
'',
'Rules:',
'- Use the real colors you see, exact hex values. Match positions and sizes as precisely as possible.',
'- TEXT MUST BE COPIED EXACTLY as written in the image: every letter, diacritic, number, symbol, emoji, punctuation mark, capital letter and line break, in the original language and script. Never translate, correct, shorten, reword or invent text. Do not skip any text that is visible, even small labels, counters and placeholders. Before answering, re-read the image and check each "text" value against it one more time.',
'- Keep each piece of text in its own element exactly where it appears, with the same alignment, relative size and weight.',
'- List containers (cards, panels, bars) before the elements inside them and set "parent" on those elements.',
'- A button is a TextButton (give it its text). Static text is a TextLabel. Input fields are TextBox. Icons and pictures are ImageLabel with "icon":true.',
'- '+(quick?'Keep it fast: only the main visible elements, at most 40.':'Be thorough: every visible element, at most 80.'),
'- "logic" is optional Luau for a LocalScript that already has: local gui (the ScreenGui), El(name) which returns the element with that name, and showScreen(screenName). Use El("ButtonName").MouseButton1Click:Connect(...) for behavior. Do not rebuild the GUI there. Only write logic when the user notes ask for behavior or when buttons obviously navigate; otherwise use "".',
'',
'User notes for you (follow them; they may be in Arabic):',
notes&&notes.trim()?notes.trim():'(none)'
  ].join('\n');
}
async function analyse(quick){
  if(!sample){status('الذكاء الاصطناعي متاح فقط لما تفتح الصفحة داخل Claude.','err');return}
  if(!canImages){status('إرسال الصور للذكاء غير متاح في هذا العرض.','err');return}
  if(!S.screens.length||S.busy)return;
  S.busy=true;S.ctl=new AbortController();setBusy(true);
  var notes=$('#notes').value,total=S.screens.length,ok=0;
  try{
    for(var i=0;i<total;i++){
      var sc=S.screens[i];
      status('جاري تحليل الصورة '+(i+1)+' من '+total+' ...','',true);
      var blob=await toBlob(sc.img);
      var raw=await sample.json(buildPrompt(sc,notes,quick),{images:blob,modelTier:quick?'quick':'complex',signal:S.ctl.signal});
      var m=normalise(raw,sc);
      if(!m.els.length)throw {code:'empty_completion'};
      sc.model=m;sc.roots=tree(m);ok++;S.cur=i;refresh();
    }
    status('تم تحليل '+ok+' صورة. تقدر تعدّل الملاحظات وتعيد التحليل، أو تصدّر الملفات.','ok');
  }catch(e){
    var c=e&&e.code,msg={need_code:'أدخل رمز الدخول ثم أعد التحليل.',not_granted:'لازم توافق على استخدام Claude من النافذة اللي تظهر.',rate_limited:'وصلت للحد المؤقت، جرّب بعد شوي.',
      invalid_json:'الذكاء رجّع نتيجة غير مفهومة، جرّب مرة ثانية أو بسّط الصورة.',empty_completion:'ما قدرت أطلع عناصر من الصورة، جرّب صورة أوضح.',
      image_rejected:'الصورة مرفوضة (نوع أو حجم غير مدعوم).',session_expired:'انتهت الجلسة، سجّل دخول من جديد.',refused:'تم رفض الطلب لهذه الصورة.',
      sampling_disabled:'Claude غير متاح لهذا الحساب.'}[c];
    if(c==='cancelled')status(ok?'تم الإيقاف بعد '+ok+' صورة.':'تم الإيقاف.','');
    else status(msg||'صار خطأ أثناء التحليل، جرّب مرة ثانية.','err');
  }finally{S.busy=false;S.ctl=null;setBusy(false);refresh()}
}
function setBusy(b){
  $('#bClaude').replaceChildren();
  var base='تحليل مطابق بـ Claude';
  $('#bClaude').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>';
  $('#bClaude').appendChild(document.createTextNode(b?'إيقاف التحليل':base));
}

/* ---------------- preview ---------------- */
function render(){
  var stage=$('#stage'),d=DEV[S.device];
  $('#zVal').textContent=Math.round(S.zoom*100)+'%';
  $('#devMeta').textContent=d.n+' · '+d.d;
  document.querySelectorAll('[data-dev]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.dev===S.device))});
  var chips=$('#screenChips');chips.replaceChildren();
  if(S.screens.length>1)S.screens.forEach(function(s,i){var b=el('button','',(s.model?s.model.name:'صورة '+(i+1)));b.setAttribute('aria-pressed',String(i===S.cur));b.onclick=function(){S.cur=i;refresh()};chips.appendChild(b)});
  $('#codeBox').hidden=S.view!=='code';
  var any=S.screens.some(function(s){return s.model});
  if(S.view==='code'&&any){$('#code').textContent=genLua(project())}
  var sc=S.screens[S.cur];
  stage.replaceChildren();
  if(S.view==='code'&&any){stage.hidden=true;return}
  stage.hidden=false;
  if(!sc||!sc.model){stage.appendChild(el('div','empty','ارفع صورة ثم اضغط تحليل'));return}
  var avail=Math.max(200,stage.clientWidth-24),s=Math.min(1,avail/d.w)*S.zoom;
  var out=el('div','dev');out.style.width=Math.round(d.w*s)+'px';out.style.height=Math.round(d.h*s)+'px';
  var inn=el('div','devin');inn.style.width=d.w+'px';inn.style.height=d.h+'px';inn.style.transform='scale('+s+')';
  var a=sc.w/sc.h,rw,rh;if(d.w/d.h>a){rh=d.h;rw=rh*a}else{rw=d.w;rh=rw/a}
  var root=el('div','rnode');root.style.cssText='left:'+(d.w-rw)/2+'px;top:'+(d.h-rh)/2+'px;width:'+rw+'px;height:'+rh+'px;background:'+sc.model.bg+';overflow:hidden';
  if(S.bg){var bi=el('img');bi.src=sc.url;bi.alt='';bi.style.cssText='position:absolute;inset:0;width:100%;height:100%;opacity:.35';root.appendChild(bi)}
  (function draw(nodes,parent,pw,ph){
    nodes.forEach(function(n){
      var e=el('div','rnode'+(n.cls==='ImageLabel'||n.icon?' icon':''));
      var ew=n.w*rw,eh=n.h*rh;
      e.style.cssText='left:'+n.rx*100+'%;top:'+n.ry*100+'%;width:'+n.rw*100+'%;height:'+n.rh*100+'%;'+
        (n.bg?'background:rgba('+rgb(n.bg).join(',')+','+n.alpha+');':'')+
        'border-radius:'+(n.radius*Math.min(ew,eh))+'px;'+
        (n.stroke?'box-shadow:inset 0 0 0 '+n.stroke.t+'px '+n.stroke.c+';':'')+
        'z-index:'+(n.z+1)+';justify-content:'+({left:'flex-start',right:'flex-end',center:'center'}[n.align])+';';
      if(n.icon&&!n.text){e.style.backgroundImage='url('+cropUrl(sc,n)+')'}
      if(n.text){var t=el('span','',n.text);t.setAttribute('dir','auto');t.style.cssText='font-size:'+(n.size*rh)+'px;font-weight:'+(n.bold?700:400)+';color:'+n.color+';text-align:'+n.align;e.appendChild(t)}
      parent.appendChild(e);
      draw(n.children,e,ew,eh);
    });
  })(sc.roots,root,rw,rh);
  inn.appendChild(root);out.appendChild(inn);stage.appendChild(out);
}
var cropCache={};
function crop(sc,n,cb){
  var sx=Math.round(n.x*sc.w),sy=Math.round(n.y*sc.h),sw=Math.max(1,Math.round(n.w*sc.w)),sh=Math.max(1,Math.round(n.h*sc.h));
  var c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(sc.img,sx,sy,sw,sh,0,0,sw,sh);return c;
}
function cropUrl(sc,n){
  var k=sc.id+n.name+n.x+n.y+n.w+n.h;
  if(!cropCache[k])cropCache[k]=crop(sc,n).toDataURL('image/png');
  return cropCache[k];
}

/* ---------------- export ---------------- */
async function save(name,data){
  var b=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},4000);status('تم تجهيز الملف: '+name,'ok');
}
async function zipOf(files){
  if(!window.JSZip){status('مكتبة الضغط ما انحمّلت.','err');return null}
  var z=new JSZip();Object.keys(files).forEach(function(k){z.file(k,files[k])});
  return z.generateAsync({type:'blob'});
}
async function exportRbxm(){var p=project();if(!p.screens.length)return;save('GeneratedGUI.rbxm',genXml(p))}
async function exportLua(){var p=project();if(!p.screens.length)return;save('GeneratedGUI.lua',genLua(p))}
function canvasBlob(c){return new Promise(function(r){c.toBlob(r,'image/png')})}
async function exportZip(){
  var files={},n=0;
  for(var i=0;i<S.screens.length;i++){
    var sc=S.screens[i];if(!sc.model)continue;
    var dir=sc.model.name+'/';
    if(S.bg){files[dir+'background.png']=sc.file;n++}
    var list=sc.model.els.filter(function(e){return e.icon&&!e.text});
    for(var j=0;j<list.length;j++){files[dir+list[j].name+'.png']=await canvasBlob(crop(sc,list[j]));n++}
  }
  if(!n){status('ما فيه أيقونات في التحليل الحالي.','');return}
  var b=await zipOf(files);if(b)save('icons.zip',b);
}

/* ---------------- server api ---------------- */
function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(blob)})}
function askCode(){$('#codeRow').hidden=false;$('#acode').focus()}
async function apiJson(prompt,o){
  var img=await b64(o.images),code='';
  try{code=sessionStorage.getItem('gc')||''}catch(e){}
  var r;
  try{r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json','x-access-code':code},body:JSON.stringify({prompt:prompt,image:img,quick:o.modelTier==='quick'}),signal:o.signal})}
  catch(e){throw {code:(o.signal&&o.signal.aborted)?'cancelled':'upstream_error'}}
  var j=await r.json().catch(function(){return {}});
  if(r.status===401){askCode();throw {code:'need_code'}}
  if(!r.ok)throw {code:r.status===429?'rate_limited':(j.code||'upstream_error')};
  return j.data;
}
$('#acodeOk').onclick=function(){try{sessionStorage.setItem('gc',$('#acode').value)}catch(e){}$('#codeRow').hidden=true;status('تم حفظ الرمز، أعد التحليل.','ok')};

/* ---------------- wiring ---------------- */
$('#file').addEventListener('change',function(e){addFiles(e.target.files);e.target.value=''});
var drop=$('#drop');
['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files)});
$('#bClaude').onclick=function(){if(S.busy){S.ctl&&S.ctl.abort()}else analyse(false)};
$('#bQuick').onclick=function(){if(!S.busy)analyse(true)};
$('#bBg').onclick=function(){S.bg=!S.bg;refresh()};
$('#bPrev').onclick=function(){S.view=S.view==='preview'?'code':'preview';$('#bPrev').lastChild.textContent=S.view==='preview'?'معاينة':'عرض الكود';render()};
$('#bRbxm').onclick=exportRbxm;$('#bLua').onclick=exportLua;$('#bZip').onclick=exportZip;
$('#bCopy').onclick=async function(){var t=$('#code').textContent;try{await navigator.clipboard.writeText(t);status('تم نسخ الكود.','ok')}catch(e){var r=document.createRange();r.selectNodeContents($('#code'));var s=getSelection();s.removeAllRanges();s.addRange(r);status('حدد الكود ونسخه يدويًا.','')}};
document.querySelectorAll('[data-dev]').forEach(function(b){b.onclick=function(){S.device=b.dataset.dev;S.view='preview';$('#bPrev').lastChild.textContent='معاينة';render()}});
$('#zIn').onclick=function(){S.zoom=Math.min(3,S.zoom+0.25);render()};
$('#zOut').onclick=function(){S.zoom=Math.max(0.25,S.zoom-0.25);render()};
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(render,120)});

refresh();
sample={json:apiJson};canImages=true;downloads=true;
})();
</script>
